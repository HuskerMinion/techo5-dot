# Every push to main and every pull request: the installer and its helpers compile and the installer's
# tests pass, from a clean checkout, so a file left out of a commit shows here at once (techo5 lost one,
# mgmt.go, and main did not build for hours while tests on the working copy passed).
name: check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Compile and test the installer
        run: |
          python3 -m py_compile tools/*.py
          python3 tools/test_install_dot.py
