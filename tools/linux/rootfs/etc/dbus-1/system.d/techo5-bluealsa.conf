<!-- TECHO5 Dot: bluealsa runs as the unprivileged user bluealsa (usr/local/sbin/techo5-bt), which the
     package's own policy (for root) does not cover. It may own its name and be reached; the daemon
     (root) and bluetoothd (root) already may send to it through that policy. -->
<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<busconfig>
  <policy user="bluealsa">
    <allow own_prefix="org.bluealsa"/>
    <allow send_destination="org.bluealsa"/>
    <allow send_destination="org.bluez"/>
  </policy>
</busconfig>
